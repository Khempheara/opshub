      operationId: listLogServices
      summary: "Service names seen in the last day (logs.view)"
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogServiceList" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/log-ingest-tokens:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [logs]
      operationId: listIngestTokens
      summary: "Ingest tokens (logs.manage)"
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestTokenList" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [logs]
      operationId: createIngestToken
      summary: "Create an ingest token for one service; the token is shown once (logs.manage)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestTokenRequest" }
      responses:
        "201":
          description: "Created. `token` is returned only now."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestToken" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/log-ingest-tokens/{tokenId}:
    parameters:
      - { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [logs]
      operationId: revokeIngestToken
      summary: "Revoke an ingest token; senders using it get 401 (logs.manage)"
      responses:
        "204": { description: "Revoked." }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/ingest/logs:
    post:
      tags: [logs]
      operationId: ingestLogs
      summary: "Send log lines (ingest token)"
      description: |
        Newline-delimited JSON objects, at most 1 MiB and 5000 lines per request. Each line
        needs `message` (or `msg`, `log`); optional `ts` (RFC 3339 or Unix seconds or
        milliseconds; at most 7 days old, and clocks more than 5 minutes ahead get the server's
        time) and `level` (debug, info, warn, error and common aliases). Every other field,
        and the fields of an `attributes` object, are kept as attributes (at most 50 keys and
        8 KiB). Messages over 8 KiB are clipped. Bad lines are reported and skipped.
      security:
        - ingestToken: []
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema: { type: string }
      responses:
        "200":
          description: "Stored."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResult" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /api/v1/agent/heartbeat:
    post:
      tags: [infrastructure]
      operationId: agentHeartbeat
      summary: An infra agent's sample (agent token)
      description: Sent by `opshub-runner agent` every `interval_seconds`. Omitted metrics are unknown.
      security:
        - agentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentHeartbeat" }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [interval_seconds]
                properties:
                  interval_seconds: { type: integer }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/runner/register:
    post:
      tags: [runner-api]
      operationId: runnerRegister
      summary: Exchange a registration token for a runner token
      description: Rate-limited to 10 attempts per minute per address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRunnerRequest" }
      responses:
        "201":
          description: Registered. The runner token is shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerRegistration" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/runner/heartbeat:
    post:
      tags: [runner-api]
      operationId: runnerHeartbeat
      summary: Report liveness and running jobs; learn which to stop
      description: |
        Send every 10 seconds. `cancel_job_ids` lists reported jobs that are no longer running
        on this runner (canceled, timed out, unknown). Running jobs of this runner that it
        doesn't report fail as `runner_lost` after 30 seconds.
      security:
        - runnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeartbeatRequest" }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartbeatResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/runner/jobs/request:
    post:
      tags: [runner-api]
      operationId: runnerRequestJob
      summary: Long-poll for a job matching the runner's labels
      description: |
        Waits up to `wait_seconds` (at most 30). Returns 204 when no job became available or the
        runner is at `max_concurrency`.
      security:
        - runnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestJobRequest" }
      responses:
        "200":
          description: A job was assigned to this runner.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssignedJob" }
        "204": { description: Nothing to do. }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/runner/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    patch:
      tags: [runner-api]
      operationId: runnerReportJob
      summary: Report a step's progress or the job's result
      description: "`409 JOB_NOT_RUNNING` means the job was canceled or finished: stop it."
      security:
        - jobToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobReportRequest" }
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/runner/jobs/{jobId}/logs:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [runner-api]
      operationId: runnerAppendLog
      summary: Append a log chunk (at most 256 KiB; re-sending a seq is ignored)
      security:
        - jobToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogChunk" }
      responses:
        "204": { description: Stored. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /api/v1/runner/jobs/{jobId}/source:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [runner-api]
      operationId: runnerGetSource
      summary: The run's commit as a gzip-compressed tarball
      description: |
        Entries sit under one top-level directory. `404 REPOSITORY_NOT_FOUND` when the project has
        no connected repository (start from an empty workspace).
      security:
        - jobToken: []
      responses:
        "200":
          description: Archive.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/runner/jobs/{jobId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [runner-api]
      operationId: runnerUploadArtifacts
      summary: Upload the job's artifacts as one gzip-compressed tar archive
      security:
        - jobToken: []
      parameters:
        - { name: name, in: query, schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,254}$" } }
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/runner/jobs/{jobId}/dependencies:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [runner-api]
      operationId: runnerListDependencies
      summary: Artifacts of the jobs this job needs
      security:
        - jobToken: []
      responses:
        "200":
          description: Artifacts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/runner/jobs/{jobId}/dependencies/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/JobID"
      - $ref: "#/components/parameters/ArtifactID"
    get:
      tags: [runner-api]
      operationId: runnerDownloadDependency
      summary: Download one dependency artifact
      security:
        - jobToken: []
      responses:
        "200":
          description: gzip-compressed tar archive.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/runner/jobs/{jobId}/cache/{key}:
    parameters:
      - $ref: "#/components/parameters/JobID"
      - $ref: "#/components/parameters/CacheKey"
    get:
      tags: [runner-api]
      operationId: runnerGetCache
      summary: Download the project's cache archive for a key
      security:
        - jobToken: []
      responses:
        "200":
          description: gzip-compressed tar archive.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    put:
      tags: [runner-api]
      operationId: runnerPutCache
      summary: Store or replace the project's cache archive for a key
      description: Least recently used entries beyond the project's quota are evicted.
      security:
        - jobToken: []
      requestBody:
        required: true
        content:
          application/gzip:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Stored. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access JWT (15 min) or personal API token (`ohp_…`).
    runnerToken:
      type: http
      scheme: bearer
      description: Runner token (`ohr_…`) from registration.
    agentToken:
      type: http
      scheme: bearer
      description: Infra agent token (`ohi_…`) issued for a server asset.
    jobToken:
      type: http
      scheme: bearer
      description: Job token (`ohj_…`) from the job assignment.
    ingestToken:
      type: http
      scheme: bearer
      description: "Log ingest token (`ohl_…`) created for one service."
    refreshCookie:
      type: apiKey
      in: cookie
      name: opshub_rt

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `next_cursor`.
      schema: { type: string }
    OrgID:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeamID:
      name: teamId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserID:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectID:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvironmentID:
      name: environmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RepositoryID:
      name: repositoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Principal:
      name: principal
      in: path
      required: true
      description: '`user:<uuid>` or `team:<uuid>`.'
      schema: { type: string, pattern: "^(user|team):[0-9a-fA-F-]{36}$" }
    RunID:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobID:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MonitorID:
      name: monitorId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleID:
      name: ruleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AlertID:
      name: alertId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SilenceID:
      name: silenceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChannelID:
      name: channelId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SecretID:
      name: secretId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetID:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TargetID:
      name: targetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeploymentID:
      name: deploymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunnerID:
      name: runnerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactID:
      name: artifactId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CacheKey:
      name: key
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,200}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated unique key (e.g. a UUID). A retry with the same key and body returns
        the original response (header `Idempotent-Replayed: true`) for 24 hours; the same key
        with a different request is `409 IDEMPOTENCY_KEY_REUSED`.
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` from the last read, e.g. `"v3"`.
      schema: { type: string }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must equal the `opshub_csrf` cookie.
      schema: { type: string }
    SSOProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [github, google, keycloak] }
    AuditArea:
      name: area
      in: query
      description: "Areas (the action before the dot, e.g. secret, monitor); repeat or comma-separate"
      style: form
      explode: true
      schema: { type: array, items: { type: string }, maxItems: 30 }
    AuditAction:
      name: action
      in: query
      description: "Exact actions (e.g. secret.read); repeat or comma-separate. Matches either an area or an action"
      style: form
      explode: true
      schema: { type: array, items: { type: string }, maxItems: 30 }
    AuditActor:
      name: actor
      in: query
      description: "User id of who did it"
      schema: { type: string, format: uuid }
    AuditProject:
      name: project
      in: query
      schema: { type: string, format: uuid }
    AuditResourceType:
      name: resource_type
      in: query
      schema: { type: string }
    AuditResourceID:
      name: resource_id
      in: query
      schema: { type: string }
    AuditFrom:
      name: from
      in: query
      description: "Start (RFC 3339), inclusive"
      schema: { type: string, format: date-time }
    AuditTo:
      name: to
      in: query
      description: "End (RFC 3339), exclusive"
      schema: { type: string, format: date-time }
    AuditLocale:
      name: locale
      in: query
      description: "Language of the summaries (en or km); defaults to Accept-Language"
      schema: { type: string, enum: [en, km] }

  headers:
    ETag:
      description: Resource version for If-Match.
      schema: { type: string, examples: ['"v3"'] }

  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string, examples: [ok] }

    Locale:
      type: string
      enum: [en, km]

    Meta:
      type: object
      required: [version, locales, default_locale, default_timezone, signup_enabled, sso_providers]
      properties:
        version: { type: string, examples: ["0.2.0"] }
        locales:
          type: array
          items: { $ref: "#/components/schemas/Locale" }
        default_locale: { $ref: "#/components/schemas/Locale" }
        default_timezone: { type: string, examples: [Asia/Phnom_Penh] }
        signup_enabled: { type: boolean }
        sso_providers:
          type: array
          items: { type: string, enum: [github, google, keycloak] }

    RegisterRequest:
      type: object
      required: [email, password, display_name]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128, description: "12–128 characters; not a common password; must not contain the email name." }
        display_name: { type: string, minLength: 1, maxLength: 100 }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string, examples: [Asia/Phnom_Penh] }
        invitation_token: { type: string, maxLength: 128, description: "Token from an invitation link. When self-service sign-up is disabled, an open invitation sent to the same email still allows registration." }

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 128 }

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, format: email }

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string }
        password: { type: string }

    LoginTwoFactorRequest:
      type: object
      additionalProperties: false
      description: Provide `code` or `recovery_code`.
      properties:
        mfa_token: { type: string }
        code: { type: string, examples: ["123456"] }
        recovery_code: { type: string, examples: [abcde-fghij] }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [authenticated, mfa_required] }
        tokens: { $ref: "#/components/schemas/TokenResponse" }
        mfa: { $ref: "#/components/schemas/MFAChallenge" }

    MFAChallenge:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, expires_at, user]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds until expiry. }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      required: [id, email, display_name, locale, timezone, khmer_numerals, email_verified, two_factor_enabled, has_password, is_platform_admin, created_at, version]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
        khmer_numerals: { type: boolean }
        email_verified: { type: boolean }
        two_factor_enabled: { type: boolean }
        has_password: { type: boolean, description: False for SSO-only accounts. }
        is_platform_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        version: { type: integer }

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string, minLength: 1, maxLength: 100 }
        locale: { $ref: "#/components/schemas/Locale" }
        timezone: { type: string }
        khmer_numerals: { type: boolean }

    ChangePasswordRequest:
      type: object
      required: [new_password]
      additionalProperties: false
      properties:
        current_password: { type: string, description: Required when the account has a password. }
        new_password: { type: string }

    PasswordRequest:
      type: object
      additionalProperties: false
      properties:
        password: { type: string }

    CodeRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string }

    DisableTwoFactorRequest:
      type: object
      additionalProperties: false
      properties:
        password: { type: string }
        code: { type: string }
        recovery_code: { type: string }

    TwoFactorStatus:
      type: object
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled: { type: boolean }
        recovery_codes_remaining: { type: integer }

    TOTPSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        otpauth_uri: { type: string, description: Encode as a QR code. }

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }

    Session:
      type: object
      required: [id, auth_method, ip, user_agent, created_at, last_used_at, expires_at, current]
      properties:
        id: { type: string, format: uuid }
        auth_method: { type: string, enum: [password, oidc] }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current: { type: boolean }

    SessionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Session" }
        next_cursor: { type: [string, "null"] }

    APIScope:
      type: string
      enum: [api:read, api:write]

    APIToken:
      type: object
      required: [id, name, prefix, scopes, expires_at, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        prefix: { type: string, examples: [ohp_abcd2345] }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/APIScope" }
        expires_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    CreatedAPIToken:
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token: { type: string, description: The secret. Shown only in this response. }

    APITokenPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/APIToken" }
        next_cursor: { type: [string, "null"] }

    CreateAPITokenRequest:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/APIScope" }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }

    Identity:
      type: object
      required: [id, provider, email, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, examples: [github] }
