        display_name: { type: string }
        two_factor_enabled: { type: boolean }
        last_login_at: { type: [string, "null"], format: date-time }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }

    MemberPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Member" }
        next_cursor: { type: [string, "null"] }

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { $ref: "#/components/schemas/Role" }

    InviteRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }

    Invitation:
      type: object
      required: [id, email, role, invited_by_name, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        invited_by_name: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    InvitationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Invitation" }
        next_cursor: { type: [string, "null"] }

    InvitationPreview:
      type: object
      required: [organization_name, organization_slug, role, email, invited_by_name, expires_at]
      properties:
        organization_name: { type: string }
        organization_slug: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        email: { type: string, format: email }
        invited_by_name: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }

    TeamRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, description: Create only; defaults to one derived from the name. }
        description: { type: string, maxLength: 500 }

    Team:
      type: object
      required: [id, slug, name, description, member_count, version, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        member_count: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }

    TeamPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Team" }
        next_cursor: { type: [string, "null"] }

    TeamMember:
      type: object
      required: [user_id, email, display_name, added_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        added_at: { type: string, format: date-time }

    TeamDetail:
      allOf:
        - $ref: "#/components/schemas/Team"
        - type: object
          required: [members]
          properties:
            members:
              type: array
              items: { $ref: "#/components/schemas/TeamMember" }

    OrganizationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        next_cursor: { type: [string, "null"] }

    CreateOrganizationRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$", description: Defaults to one derived from the name. }

    Project:
      type: object
      required: [id, organization_id, slug, name, description, default_branch, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        default_branch: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectAction:
      type: string
      enum: [project.view, project.update, project.delete, project.manage_members, repo.connect, environment.manage, run.view, pipeline.trigger, run.cancel, approval.decide, deployment.view, deployment.create, deployment.rollback, secret.list, secret.create, secret.update, secret.rotate, secret.delete]

    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          required: [role, actions]
          properties:
            role: { $ref: "#/components/schemas/Role" }
            actions:
              type: array
              items: { $ref: "#/components/schemas/ProjectAction" }

    ProjectPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        next_cursor: { type: [string, "null"] }

    CreateProjectRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,38}[a-z0-9])?$", description: Defaults to one derived from the name. }
        description: { type: string, maxLength: 500 }
        default_branch: { type: string, maxLength: 255, description: Defaults to main. }

    UpdateProjectRequest:
      type: object
      required: [name, default_branch]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        default_branch: { type: string, minLength: 1, maxLength: 255 }

    ProjectMember:
      type: object
      required: [principal, type, id, name, role, source]
      properties:
        principal: { type: string, examples: ["user:0190d1e2-…"] }
        type: { type: string, enum: [user, team] }
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        member_count: { type: integer, description: Teams only. }
        role: { $ref: "#/components/schemas/Role" }
        source:
          type: string
          enum: [direct, team, organization]
          description: '`organization` = inherited from the org role (read-only here).'
        granted_at: { type: string, format: date-time }

    GrantRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [admin, developer, viewer]
          description: Owner can't be granted per project.

    GitProvider:
      type: string
      enum: [github, gitlab]

    Repository:
      type: object
      required: [id, provider, base_url, full_name, web_url, clone_url, default_branch, webhook_mode, webhook_url, last_delivery_at, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: "#/components/schemas/GitProvider" }
        base_url: { type: [string, "null"], description: Self-hosted instance; null for github.com / gitlab.com. }
        full_name: { type: string, examples: [acme/payments-api] }
        web_url: { type: string }
        clone_url: { type: string }
        default_branch: { type: string }
        webhook_mode: { type: string, enum: [automatic, manual] }
        webhook_url: { type: string }
        last_delivery_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ConnectRepositoryRequest:
      type: object
      required: [provider, full_name, access_token]
      additionalProperties: false
      properties:
        provider: { $ref: "#/components/schemas/GitProvider" }
        base_url: { type: string, maxLength: 255, description: "https URL of a self-hosted GitHub Enterprise / GitLab; empty for the cloud service." }
        full_name: { type: string, maxLength: 255, description: '`owner/repo` (GitHub) or `group/subgroup/project` (GitLab).' }
        access_token:
          type: string
          maxLength: 512
          writeOnly: true
          description: Personal/project access token. Stored encrypted; never returned.

    ConnectRepositoryResult:
      type: object
      required: [repository, webhook]
      properties:
        repository: { $ref: "#/components/schemas/Repository" }
        webhook:
          type: object
          required: [mode, url]
          properties:
            mode: { type: string, enum: [automatic, manual] }
            url: { type: string }
            secret: { type: string, description: Manual mode only; shown once. }
            reason:
              type: string
              enum: [token_cannot_manage_webhooks, provider_rejected_webhook, provider_unreachable]

    RepositoryTest:
      type: object
      required: [default_branch, can_manage_webhooks, webhook_installed, full_name]
      properties:
        default_branch: { type: string }
        can_manage_webhooks: { type: boolean }
        webhook_installed: { type: boolean }
        full_name: { type: string }

    WebhookDelivery:
      type: object
      required: [id, delivery_id, event, ref, commit_sha, signature_valid, received_at]
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string }
        event: { type: string, examples: [push, tag_push, pull_request, ping] }
        ref: { type: string }
        commit_sha: { type: string }
        signature_valid: { type: boolean }
        received_at: { type: string, format: date-time }

    WebhookDeliveryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/WebhookDelivery" }
        next_cursor: { type: [string, "null"] }

    WebhookAck:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [accepted, duplicate] }

    EnvironmentKind:
      type: string
      enum: [development, staging, production]

    Protection:
      type: object
      required: [required_approvals, allowed_branches, allowed_roles]
      properties:
        required_approvals: { type: integer, minimum: 0, maximum: 10 }
        allowed_branches:
          type: array
          maxItems: 20
          items: { type: string }
          description: Glob patterns such as `main` or `release/*`; empty = any branch.
        allowed_roles:
          type: array
          minItems: 1
          items: { type: string, enum: [owner, admin, developer] }
          description: Project roles that may deploy to or approve for this environment.

    Environment:
      type: object
      required: [id, project_id, name, kind, variables, protection, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string, examples: [production] }
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        variables:
          type: object
          additionalProperties: { type: string }
          description: Non-secret configuration. Secrets are managed separately.
        protection:
          oneOf:
            - $ref: "#/components/schemas/Protection"
            - type: "null"
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EnvironmentRequest:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9](?:[a-z0-9_-]{0,38}[a-z0-9])?$", description: Required on create; ignored on update. }
        kind: { $ref: "#/components/schemas/EnvironmentKind" }
        variables:
          type: object
          maxProperties: 100
          additionalProperties: { type: string, maxLength: 4096 }
          propertyNames: { pattern: "^[A-Za-z_][A-Za-z0-9_]{0,63}$" }
        protection:
          oneOf:
            - $ref: "#/components/schemas/Protection"
            - type: "null"

    RunStatus:
      type: string
      enum: [queued, running, waiting, succeeded, failed, canceled]
    RunTrigger:
      type: string
      enum: [push, pull_request, tag, manual, schedule]
    JobStatus:
      type: string
      enum: [created, waiting_approval, queued, running, succeeded, failed, canceled, skipped]
    StepStatus:
      type: string
      enum: [pending, running, succeeded, failed, skipped, canceled]

    PipelineProblem:
      type: object
      required: [line, column, path, rule]
      properties:
        line: { type: integer }
        column: { type: integer }
        path: { type: string, examples: ["jobs.build.needs[0]"] }
        rule:
          type: string
          description: Stable code, translated by the UI (docs/pipelines.md lists them).
          examples: [unknown_stage, cycle, required]
        param: { type: string }

    Run:
      type: object
      required: [id, project_id, number, status, trigger, ref, ref_name, commit_sha, title, actor_name, created_by, created_by_name, rerun_of, variables, problems, created_at, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        number: { type: integer }
        status: { $ref: "#/components/schemas/RunStatus" }
        trigger: { $ref: "#/components/schemas/RunTrigger" }
        ref: { type: string, examples: [refs/heads/main] }
        ref_name: { type: string, examples: [main] }
        commit_sha: { type: string }
        title: { type: string, description: Commit message (first line) or pull request title. }
        actor_name: { type: string, description: Git host username for webhook runs. }
        created_by: { type: [string, "null"], format: uuid }
        created_by_name: { type: string }
        rerun_of: { type: [string, "null"], format: uuid }
        variables: { type: object, additionalProperties: { type: string } }
        problems:
          type: array
          items: { $ref: "#/components/schemas/PipelineProblem" }
          description: Why the pipeline file was invalid (the run failed without jobs).
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    RunPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Run" }
        next_cursor: { type: [string, "null"] }

    Step:
      type: object
      required: [index, name, command, status, exit_code, started_at, finished_at]
      properties:
        index: { type: integer }
        name: { type: string }
        command: { type: string }
        status: { $ref: "#/components/schemas/StepStatus" }
        exit_code: { type: [integer, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    Job:
      type: object
      required: [id, run_id, name, stage, stage_index, needs, condition, environment, image, runs_on, status, attempt, failure_reason, exit_code, timeout_seconds, queued_at, started_at, finished_at, steps]
      properties:
        id: { type: string, format: uuid }
        run_id: { type: string, format: uuid }
        name: { type: string }
        stage: { type: string }
        stage_index: { type: integer }
        needs: { type: array, items: { type: string } }
        condition: { type: string, enum: [on_success, on_failure, always, manual] }
        environment: { type: [string, "null"] }
        image: { type: string }
        runs_on: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/JobStatus" }
        attempt: { type: integer }
        failure_reason:
          type: [string, "null"]
          description: upstream_failed, not_needed, rejected, branch_not_allowed, environment_not_found, timeout, no_runner, step_failed, runner_error, runner_lost, deploy_failed, target_not_found, deploy_invalid, secret_not_found, secrets_not_allowed
        exit_code: { type: [integer, "null"] }
        timeout_seconds: { type: integer }
        queued_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        steps:
          type: array
          items: { $ref: "#/components/schemas/Step" }

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          required: [stages, jobs]
          properties:
            stages: { type: array, items: { type: string } }
            jobs:
              type: array
              items: { $ref: "#/components/schemas/Job" }

    Approval:
      type: object
      required: [user_id, user_name, decision, comment, created_at]
      properties:
        user_id: { type: string, format: uuid }
        user_name: { type: string }
        decision: { type: string, enum: [approved, rejected] }
        comment: { type: string }
        created_at: { type: string, format: date-time }

    ApprovalState:
      type: object
      required: [required, approved, protected, allowed_roles, allowed_branches, approvals, can_decide]
      properties:
        required: { type: integer }
        approved: { type: integer }
        protected: { type: boolean }
        allowed_roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        allowed_branches: { type: array, items: { type: string } }
        approvals:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
        can_decide: { type: boolean }
        denied_reason: { type: string, enum: [not_waiting, permission, role, self, already_decided] }

    JobAttempt:
      type: object
      required: [id, attempt, status, started_at, finished_at]
      properties:
        id: { type: string, format: uuid }
        attempt: { type: integer }
        status: { $ref: "#/components/schemas/JobStatus" }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    JobDetail:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          required: [run_number, attempts, approval]
          properties:
            run_number: { type: integer }
            attempts:
              type: array
              items: { $ref: "#/components/schemas/JobAttempt" }
            approval:
              oneOf:
                - $ref: "#/components/schemas/ApprovalState"
                - type: "null"

    LogChunk:
      type: object
      required: [seq, content]
      properties:
        seq: { type: integer }
        content: { type: string }

    LogPage:
      type: object
      required: [items, next_seq, complete]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LogChunk" }
        next_seq: { type: integer, description: Pass as after_seq for the next page. }
        complete: { type: boolean, description: The job finished and every chunk was returned. }

    TriggerRunRequest:
      type: object
      additionalProperties: false
      properties:
        ref: { type: string, maxLength: 255, description: "Branch, tag or commit; defaults to the default branch." }
        variables:
          type: object
          maxProperties: 50
          additionalProperties: { type: string, maxLength: 4096 }

    RerunRequest:
      type: object
      additionalProperties: false
      properties:
        failed_only: { type: boolean, default: false }

    ApprovalRequest:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision: { type: string, enum: [approved, rejected] }
        comment: { type: string, maxLength: 500 }

    ValidatePipelineRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, maxLength: 262144 }

    ValidatePipelineResult:
      type: object
      required: [valid, problems, definition]
      properties:
        valid: { type: boolean }
        problems:
          type: array
          items: { $ref: "#/components/schemas/PipelineProblem" }
        definition:
          description: The normalized definition (jobs with resolved needs) when valid.
          oneOf:
            - type: object
            - type: "null"

    Runner:
      type: object
      required: [id, name, labels, version, os, arch, max_concurrency, status, running_jobs, last_seen_at, token_prefix, row_version, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        labels: { type: array, items: { type: string } }
        version: { type: string }
        os: { type: string }
        arch: { type: string }
        max_concurrency: { type: integer, minimum: 1, maximum: 64 }
        status: { type: string, enum: [online, offline, disabled] }
        running_jobs: { type: integer }
        last_seen_at: { type: [string, "null"], format: date-time }
        token_prefix: { type: string, examples: [ohr_k3j9x2ab] }
        row_version: { type: integer }
        created_at: { type: string, format: date-time }

    RunnerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Runner" }

    RunnerLabels:
      type: array
      maxItems: 20
      items: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }

    RegistrationTokenRequest:
      type: object
      additionalProperties: false
      properties:
        labels: { $ref: "#/components/schemas/RunnerLabels" }

    RegistrationToken:
      type: object
      required: [token, labels, expires_at]
      properties:
        token: { type: string, description: "`ohr_reg_…`, shown once." }
        labels: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }

    UpdateRunnerRequest:
      type: object
      required: [name, labels, max_concurrency, disabled]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        labels: { $ref: "#/components/schemas/RunnerLabels" }
        max_concurrency: { type: integer, minimum: 1, maximum: 64 }
        disabled: { type: boolean }

    Artifact:
      type: object
      required: [id, job_id, name, size_bytes, sha256, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        job_name: { type: string }
        name: { type: string, examples: [build.tar.gz] }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ArtifactList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Artifact" }

    RegisterRunnerRequest:
      type: object
      required: [token, name]
      additionalProperties: false
      properties:
        token: { type: string, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 100 }
        labels: { $ref: "#/components/schemas/RunnerLabels" }
        version: { type: string, maxLength: 50 }
        os: { type: string, maxLength: 50 }
        arch: { type: string, maxLength: 50 }
        max_concurrency: { type: integer, minimum: 0, maximum: 64, description: 0 means 1. }

    RunnerRegistration:
      type: object
      required: [id, token, name, labels, heartbeat_interval_seconds]
      properties:
        id: { type: string, format: uuid }
        token: { type: string, description: "`ohr_…`, shown once." }
        name: { type: string }
        labels: { type: array, items: { type: string } }
        heartbeat_interval_seconds: { type: integer }

    HeartbeatRequest:
      type: object
      additionalProperties: false
      properties:
        version: { type: string, maxLength: 50 }
        os: { type: string, maxLength: 50 }
        arch: { type: string, maxLength: 50 }
        running_job_ids: { type: array, maxItems: 64, items: { type: string, format: uuid } }

    HeartbeatResponse:
      type: object
      required: [cancel_job_ids]
      properties:
        cancel_job_ids: { type: array, items: { type: string, format: uuid } }

    RequestJobRequest:
      type: object
      additionalProperties: false
      properties:
        wait_seconds: { type: integer, minimum: 0, maximum: 30, description: 0 means 30. }

    AssignedJob:
      type: object
      required: [job, spec, run_id, run_number, project_id, ref, commit_sha, variables, token, secrets, masks]
      properties:
        job: { $ref: "#/components/schemas/Job" }
        spec:
          type: object
          description: The job as parsed from `.opshub.yml` (image, steps, artifacts, cache, …).
        run_id: { type: string, format: uuid }
        run_number: { type: integer }
        project_id: { type: string, format: uuid }
        ref: { type: string }
        commit_sha: { type: string }
        variables: { type: object, additionalProperties: { type: string } }
        token: { type: string, description: "Job token (`ohj_…`) for /runner/jobs/{jobId}/…" }
        secrets:
          type: object
          additionalProperties: { type: string }
          description: The job's `secrets:`, decrypted. Set them as environment variables (they win over `variables`); never log them.
        masks: { type: array, items: { type: string }, description: Values to hide in log output (the API masks stored output too). }

    JobReportRequest:
      type: object
      additionalProperties: false
      description: Exactly one of `step` or `complete`.
      properties:
        step:
          type: object
          required: [index, status]
          properties:
            index: { type: integer, minimum: 0 }
            status: { type: string, enum: [running, succeeded, failed, skipped, canceled] }
            exit_code: { type: [integer, "null"] }
        complete:
          type: object
          required: [success]
          properties:
            success: { type: boolean }
            exit_code: { type: [integer, "null"] }
            reason: { type: string, enum: [step_failed, timeout, runner_error] }

    DeployTargetKind:
      type: string
      enum: [ssh, docker, kubernetes]
    DeployStrategy:
      type: string
      enum: [rolling, blue_green]
    DeploymentStatus:
      type: string
      enum: [pending, running, succeeded, failed]

    HealthCheck:
      type: object
      required: [url]
      properties:
        url: { type: string, description: "http(s); `{host}` becomes each SSH/Docker host's name." }
        expected_status: { type: integer, minimum: 100, maximum: 599, description: 0 or omitted = any 2xx. }
        timeout_seconds: { type: integer, minimum: 0, maximum: 900, description: Default 60. }

    SSHTargetConfig:
      type: object
      required: [hosts, user, command]
      properties:
        hosts: { type: array, minItems: 1, maxItems: 50, items: { type: string, examples: ["web-1.internal", "10.0.0.5:2222"] } }
        user: { type: string }
        host_keys: { type: object, additionalProperties: { type: string }, description: "host:port → pinned SHA256 fingerprint" }
        command: { type: string, maxLength: 4000, description: "Runs with $OPSHUB_VERSION, $OPSHUB_PREVIOUS_VERSION, $OPSHUB_ENVIRONMENT, … set." }
        batch_size: { type: integer, minimum: 1, maximum: 50, default: 1 }
        health_check: { $ref: "#/components/schemas/HealthCheck" }

    DockerTargetConfig:
      type: object
      required: [connection, container]
      properties:
        connection: { type: string, enum: [ssh, tls, local] }
        host: { type: string, description: "ssh: host[:22]; tls: host:port (default 2376)" }
        user: { type: string }
        host_key: { type: string, description: Pinned SHA256 fingerprint (ssh). }
        socket: { type: string, default: /var/run/docker.sock }
        container: { type: string }
        replicas: { type: integer, minimum: 1, maximum: 20, default: 1 }
        ports: { type: array, items: { type: string, examples: ["80:8080"] }, description: "[ip:]host:container; one replica only." }
        env: { type: object, additionalProperties: { type: string } }
        network: { type: string }
        restart: { type: string, enum: ["no", always, unless-stopped, on-failure], default: unless-stopped }
        health_check: { $ref: "#/components/schemas/HealthCheck" }

    KubernetesTargetConfig:
      type: object
      required: [deployment]
      properties:
        namespace: { type: string, default: default }
        deployment: { type: string }
        container: { type: string, description: Default the first container. }
        service: { type: string, description: Required for blue/green. }
        rollout_timeout_seconds: { type: integer, minimum: 10, maximum: 3600, default: 300 }
        health_check: { $ref: "#/components/schemas/HealthCheck" }

    DeployTargetConfig:
      oneOf:
        - $ref: "#/components/schemas/SSHTargetConfig"
        - $ref: "#/components/schemas/DockerTargetConfig"
        - $ref: "#/components/schemas/KubernetesTargetConfig"

    DeployTargetCredentials:
      type: object
      description: |
        Write-only. SSH: private_key (+ passphrase) or password. Docker: private_key (ssh),
        ca_cert/client_cert/client_key (tls), optional registry_server/registry_username/
        registry_password. Kubernetes: kubeconfig (token or embedded client certificate).
      additionalProperties: { type: string }

    DeployTarget:
      type: object
      required: [id, name, kind, description, config, credentials, last_test_at, last_test_ok, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/DeployTargetKind" }
        description: { type: string }
        config: { $ref: "#/components/schemas/DeployTargetConfig" }
        credentials: { type: array, items: { type: string }, description: Names of the credential fields that are set. }
        last_test_at: { type: [string, "null"], format: date-time }
        last_test_ok: { type: [boolean, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeployTargetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DeployTarget" }

    CreateDeployTargetRequest:
      type: object
      required: [name, kind, config, credentials]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9](?:[a-z0-9_-]{0,38}[a-z0-9])?$" }
        kind: { $ref: "#/components/schemas/DeployTargetKind" }
        description: { type: string, maxLength: 500 }
        config: { $ref: "#/components/schemas/DeployTargetConfig" }
        credentials: { $ref: "#/components/schemas/DeployTargetCredentials" }

    UpdateDeployTargetRequest:
      type: object
      required: [config]
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 500 }
        config: { $ref: "#/components/schemas/DeployTargetConfig" }
        credentials: { $ref: "#/components/schemas/DeployTargetCredentials" }

    TargetCheck:
      type: object
      required: [name, ok]
      properties:
        name: { type: string }
        ok: { type: boolean }
        detail: { type: string }
        fingerprint: { type: string, description: SSH host key fingerprint to pin. }
        pinned: { type: boolean }

    TargetTestResult:
      type: object
      required: [ok, checks]
      properties:
        ok: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/TargetCheck" }

    HealthResult:
      type: object
      required: [target, ok, attempts, at]
      properties:
        target: { type: string }
        ok: { type: boolean }
        status: { type: integer }
        attempts: { type: integer }
        detail: { type: string }
        at: { type: string, format: date-time }

    Deployment:
      type: object
      required: [id, project_id, number, environment_id, environment_name, target_id, target_name, target_kind, version, previous_version, strategy, status, failure_reason, reverted, current, health, run_id, run_number, job_id, job_name, rollback_of_id, created_by, created_by_name, started_at, finished_at, created_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        number: { type: integer }
        environment_id: { type: string, format: uuid }
        environment_name: { type: string }
        target_id: { type: [string, "null"], format: uuid }
        target_name: { type: string }
        target_kind: { $ref: "#/components/schemas/DeployTargetKind" }
        version: { type: string, description: The container image. }
        previous_version: { type: string }
        strategy: { $ref: "#/components/schemas/DeployStrategy" }
        status: { $ref: "#/components/schemas/DeploymentStatus" }
        failure_reason:
          type: [string, "null"]
          description: deploy_failed, health_check_failed, target_unreachable, host_key_untrusted, target_missing, interrupted, strategy_not_supported
        reverted: { type: boolean, description: The failure put the previous release back. }
        current: { type: boolean, description: The environment runs this release now. }
        health:
          type: array
          items: { $ref: "#/components/schemas/HealthResult" }
        run_id: { type: [string, "null"], format: uuid }
        run_number: { type: [integer, "null"] }
        job_id: { type: [string, "null"], format: uuid }
        job_name: { type: string }
        rollback_of_id: { type: [string, "null"], format: uuid }
        created_by: { type: [string, "null"], format: uuid }
        created_by_name: { type: string }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    DeploymentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Deployment" }
        next_cursor: { type: [string, "null"] }

    CreateDeploymentRequest:
      type: object
      required: [target_id, version]
      additionalProperties: false
      properties:
        target_id: { type: string, format: uuid }
        version: { type: string, maxLength: 255, examples: ["ghcr.io/acme/api:3f2a9c1"] }
        strategy: { $ref: "#/components/schemas/DeployStrategy" }

    AssetKind:
      type: string
      enum: [server, cluster, database, domain]
    AssetStatus:
      type: string
      description: "Servers: online, offline, pending (no heartbeat yet), no_agent. Domains: valid, expiring (< 30 days), expired, error, unchecked. Others: inventory."
      enum: [online, offline, pending, no_agent, valid, expiring, expired, error, unchecked, inventory]

    AssetMetrics:
      type: object
      required: [cpu_pct, mem_pct, disk_pct, load1]
      properties:
        cpu_pct: { type: [number, "null"] }
        mem_pct: { type: [number, "null"] }
        disk_pct: { type: [number, "null"] }
        load1: { type: [number, "null"] }

    AssetAgent:
      type: object
      description: Present for servers. Version, hostname, os and arch come from the latest heartbeat.
      required: [installed, token_prefix, version, hostname, os, arch, last_heartbeat_at]
      properties:
        installed: { type: boolean, description: "An agent token exists. Whether an agent reports with it shows in last_heartbeat_at." }
        token_prefix: { type: string }
        version: { type: string }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        last_heartbeat_at: { type: [string, "null"], format: date-time }

    CertificateSummary:
      type: object
      required: [not_after, error, checked_at]
      properties:
        not_after: { type: [string, "null"], format: date-time }
        error: { type: string }
        checked_at: { type: [string, "null"], format: date-time }

    Asset:
      type: object
      required: [id, kind, name, address, description, tags, metadata, tls_port, status, agent, metrics, certificate, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/AssetKind" }
        name: { type: string }
        address: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
        tls_port: { type: integer }
        status: { $ref: "#/components/schemas/AssetStatus" }
        agent:
          oneOf:
            - $ref: "#/components/schemas/AssetAgent"
            - type: "null"
        metrics:
          oneOf:
            - $ref: "#/components/schemas/AssetMetrics"
            - type: "null"
        certificate:
          oneOf:
            - $ref: "#/components/schemas/CertificateSummary"
            - type: "null"
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Asset" }

    AssetRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/AssetKind" }
        name: { type: string, minLength: 1, maxLength: 100 }
        address: { type: string, maxLength: 255, description: "Host or IP (server), URL or host (cluster), host[:port] (database), domain name (domain, required)." }
        description: { type: string, maxLength: 500 }
        tags: { type: array, maxItems: 20, items: { type: string, pattern: "^[a-z0-9][a-z0-9._:-]{0,62}$" } }
        metadata: { type: object, maxProperties: 50, additionalProperties: { type: string, maxLength: 500 } }
        tls_port: { type: integer, minimum: 1, maximum: 65535, default: 443 }

    AgentToken:
      type: object
      required: [asset_id, token, token_prefix]
      properties:
        asset_id: { type: string, format: uuid }
        token: { type: string, description: "`ohi_…`, shown once." }
        token_prefix: { type: string }

    AgentHeartbeat:
      type: object
      additionalProperties: false
      properties:
        version: { type: string, maxLength: 50 }
        hostname: { type: string, maxLength: 255 }
        os: { type: string, maxLength: 50 }
        arch: { type: string, maxLength: 50 }
        uptime_seconds: { type: integer, minimum: 0 }
        cpu_pct: { type: [number, "null"], minimum: 0, maximum: 100 }
        mem_pct: { type: [number, "null"], minimum: 0, maximum: 100 }
        disk_pct: { type: [number, "null"], minimum: 0, maximum: 100 }
        load1: { type: [number, "null"], minimum: 0 }

    MetricPoint:
      type: object
      required: [t, cpu_pct, cpu_max, mem_pct, mem_max, disk_pct, disk_max]
      properties:
        t: { type: string, format: date-time }
        cpu_pct: { type: [number, "null"] }
        cpu_max: { type: [number, "null"] }
        mem_pct: { type: [number, "null"] }
        mem_max: { type: [number, "null"] }
        disk_pct: { type: [number, "null"] }
        disk_max: { type: [number, "null"] }

    MetricSeries:
      type: object
      required: [from, to, step_seconds, source, points]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step_seconds: { type: integer }
        source: { type: string, enum: [raw, hourly] }
        points:
          type: array
          items: { $ref: "#/components/schemas/MetricPoint" }

    Certificate:
      type: object
      required: [asset_id, asset_name, asset_tags, host, port, subject, issuer, dns_names, serial, fingerprint, not_before, not_after, days_left, status, error, last_checked_at]
      properties:
        asset_id: { type: string, format: uuid }
        asset_name: { type: string }
        asset_tags: { type: array, items: { type: string } }
        host: { type: string }
        port: { type: integer }
        subject: { type: string }
        issuer: { type: string }
        dns_names: { type: array, items: { type: string } }
        serial: { type: string }
        fingerprint: { type: string, description: SHA-256 of the leaf certificate, hex. }
        not_before: { type: [string, "null"], format: date-time }
        not_after: { type: [string, "null"], format: date-time }
        days_left: { type: [integer, "null"] }
        status: { type: string, enum: [valid, expiring, expired, error] }
        error: { type: string, description: Empty when valid and trusted for the host. }
        last_checked_at: { type: string, format: date-time }

    CertificateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Certificate" }

    Secret:
      type: object
      description: A secret's metadata. The value is write-only.
      required: [id, project_id, name, description, environment_id, environment_name, protected, can_manage, current_version, version, created_at, updated_at, rotated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,127}$" }
        description: { type: string }
        environment_id: { type: [string, "null"], format: uuid, description: null = every environment }
        environment_name: { type: [string, "null"] }
        protected: { type: boolean, description: The secret reaches a protected environment (project-wide secrets reach them all). }
        can_manage: { type: boolean, description: "Whether the caller may update, rotate or delete it." }
        current_version: { type: integer, minimum: 1 }
        version: { type: integer, description: ETag version. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        rotated_at: { type: string, format: date-time, description: When the current value was set. }
    SecretList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Secret" }
    SecretCreateRequest:
      type: object
      additionalProperties: false
      required: [name, value]
      properties:
        name: { type: string, pattern: "^[A-Z_][A-Z0-9_]{0,127}$", description: "Becomes an environment variable; names starting with OPSHUB_ are reserved." }
        environment_id: { type: [string, "null"], format: uuid, description: Omit or null for every environment. }
        description: { type: string, maxLength: 500 }
        value: { type: string, minLength: 1, description: "At most 64 KiB; no NUL bytes. Never returned." }
    SecretUpdateRequest:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: { type: string, maxLength: 500 }
    SecretRotateRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 1, description: "At most 64 KiB; no NUL bytes. Never returned." }
    SecretVersion:
      type: object
      required: [version, current, created_at, created_by, created_by_name, destroyed_at]
      properties:
        version: { type: integer }
        current: { type: boolean }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], format: uuid }
        created_by_name: { type: [string, "null"] }
        destroyed_at: { type: [string, "null"], format: date-time, description: When the value was destroyed (by a rotation or deletion). }
    SecretVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SecretVersion" }

    MonitorKind: { type: string, enum: [http, tcp, ssl] }
    MonitorSettings:
      type: object
      description: "By kind. http: method, expected_status (empty = 200–399), keyword. ssl: expiry_days."
      properties:
        method: { type: string, enum: [GET, HEAD] }
        expected_status: { type: array, maxItems: 20, items: { type: integer, minimum: 100, maximum: 599 } }
        keyword: { type: string, maxLength: 200 }
        expiry_days: { type: integer, minimum: 1, maximum: 90 }
    Monitor:
      type: object
      required: [id, name, kind, target, interval_seconds, timeout_ms, settings, labels, enabled, status, last_checked_at, last_latency_ms, last_error, down_since, uptime_24h, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/MonitorKind" }
        target: { type: string, description: "A URL for http; host:port for tcp and ssl." }
        interval_seconds: { type: integer }
        timeout_ms: { type: integer }
        settings: { $ref: "#/components/schemas/MonitorSettings" }
        labels: { type: array, items: { type: string } }
        enabled: { type: boolean }
        status: { type: string, enum: [up, down, pending, paused] }
        last_checked_at: { type: [string, "null"], format: date-time }
        last_latency_ms: { type: [integer, "null"] }
        last_error: { type: string }
        down_since: { type: [string, "null"], format: date-time }
        uptime_24h: { type: [number, "null"], description: "Percent of successful checks in the last 24 hours." }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MonitorList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Monitor" } }
    MonitorRequest:
      type: object
      additionalProperties: false
      required: [name, target]
      properties:
        name: { type: string, maxLength: 100 }
        kind: { $ref: "#/components/schemas/MonitorKind" }
        target: { type: string, maxLength: 2048 }
        interval_seconds: { type: integer, minimum: 30, maximum: 3600, description: "Default 60." }
        timeout_ms: { type: integer, minimum: 1000, maximum: 30000, description: "Default 10000; less than the interval." }
        settings: { $ref: "#/components/schemas/MonitorSettings" }
        labels: { type: array, maxItems: 20, items: { type: string, pattern: "^[a-z0-9][a-z0-9._:-]{0,62}$" } }
        enabled: { type: boolean, description: "Default true; false pauses the monitor." }
    MonitorPoint:
      type: object
      required: [t, checks, up_checks, latency_avg, latency_max]
      properties:
        t: { type: string, format: date-time }
        checks: { type: integer }
        up_checks: { type: integer }
        latency_avg: { type: [number, "null"] }
        latency_max: { type: [integer, "null"] }
    MonitorCheck:
      type: object
      required: [at, up, latency_ms, status_code, error]
      properties:
        at: { type: string, format: date-time }
        up: { type: boolean }
        latency_ms: { type: [integer, "null"] }
        status_code: { type: [integer, "null"] }
        error: { type: string }
    MonitorResults:
      type: object
      required: [from, to, step_seconds, source, uptime, points, recent]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        step_seconds: { type: integer }
        source: { type: string, enum: [raw, hourly] }
        uptime: { type: [number, "null"], description: "Percent of successful checks in the range." }
        points: { type: array, items: { $ref: "#/components/schemas/MonitorPoint" } }
        recent: { type: array, items: { $ref: "#/components/schemas/MonitorCheck" }, description: "The latest 20 checks, newest first." }
    AlertRuleKind: { type: string, enum: [monitor_down, monitor_latency, asset_metric, asset_offline, certificate] }
    AlertSeverity: { type: string, enum: [info, warning, critical] }
    EscalationStep:
      type: object
      required: [after_minutes, channel_ids]
      properties:
        after_minutes: { type: integer, minimum: 0, maximum: 1440, description: "0 for the first step; increasing after that." }
        channel_ids: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
    AlertRule:
      type: object
      required: [id, name, kind, target_id, label, threshold, metric, for_seconds, severity, escalation, enabled, firing, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/AlertRuleKind" }
        target_id: { type: [string, "null"], format: uuid, description: "One monitor or asset; null = all of them." }
        label: { type: [string, "null"], description: "Only monitors with this label or assets with this tag." }
        threshold: { type: [number, "null"], description: "monitor_latency: ms; asset_metric: percent; certificate: days." }
        metric: { type: [string, "null"], enum: [cpu, mem, disk, null] }
        for_seconds: { type: integer, description: "How long the condition must hold before the alert fires." }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        escalation: { type: array, items: { $ref: "#/components/schemas/EscalationStep" } }
        enabled: { type: boolean }
        firing: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AlertRuleList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AlertRule" } }
    AlertRuleRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        kind: { $ref: "#/components/schemas/AlertRuleKind" }
        target_id: { type: [string, "null"], format: uuid }
        label: { type: [string, "null"] }
        threshold: { type: [number, "null"] }
        metric: { type: [string, "null"], enum: [cpu, mem, disk, null] }
        for_seconds: { type: integer, minimum: 0, maximum: 86400 }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        escalation: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/EscalationStep" } }
        enabled: { type: boolean }
    AlertDetails:
      type: object
      description: "What the rule observed; only the fields of its kind are set."
      properties:
        value: { type: number }
        threshold: { type: number }
        metric: { type: string }
        error: { type: string }
        since: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        days: { type: integer }
    Alert:
      type: object
      required: [id, rule_id, rule_name, rule_kind, severity, subject_type, subject_id, subject_name, subject_labels, status, details, started_at, resolved_at, acknowledged_at, acknowledged_by_name, silenced]
      properties:
        id: { type: string, format: uuid }
        rule_id: { type: [string, "null"], format: uuid, description: "null once the rule was deleted." }
        rule_name: { type: string }
        rule_kind: { $ref: "#/components/schemas/AlertRuleKind" }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        subject_type: { type: string, enum: [monitor, asset] }
        subject_id: { type: string, format: uuid }
        subject_name: { type: string }
        subject_labels: { type: array, items: { type: string } }
        status: { type: string, enum: [firing, resolved] }
        details: { $ref: "#/components/schemas/AlertDetails" }
        started_at: { type: [string, "null"], format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        acknowledged_at: { type: [string, "null"], format: date-time }
        acknowledged_by_name: { type: [string, "null"] }
        silenced: { type: boolean, description: "An active silence mutes it now." }
    AlertList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Alert" } }
    AlertEvent:
      type: object
      required: [at, kind, channel_id, channel_name, user_name, detail]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string, enum: [fired, notified, notify_failed, escalated, acknowledged, silenced, resolved] }
        channel_id: { type: [string, "null"], format: uuid }
        channel_name: { type: string }
        user_name: { type: [string, "null"] }
        detail: { type: string }
    AlertDetail:
      allOf:
        - $ref: "#/components/schemas/Alert"
        - type: object
          required: [events]
          properties:
            events: { type: array, items: { $ref: "#/components/schemas/AlertEvent" } }
    Silence:
      type: object
      required: [id, rule_id, rule_name, subject_id, label, severity, comment, starts_at, ends_at, active, created_by_name, created_at]
      properties:
        id: { type: string, format: uuid }
        rule_id: { type: [string, "null"], format: uuid }
        rule_name: { type: [string, "null"] }
        subject_id: { type: [string, "null"], format: uuid }
        label: { type: [string, "null"] }
        severity: { oneOf: [{ $ref: "#/components/schemas/AlertSeverity" }, { type: "null" }] }
        comment: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        active: { type: boolean }
        created_by_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    SilenceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Silence" } }
    SilenceRequest:
      type: object
      additionalProperties: false
      required: [ends_at]
      properties:
        rule_id: { type: [string, "null"], format: uuid }
        subject_id: { type: [string, "null"], format: uuid, description: "A monitor or asset." }
        label: { type: [string, "null"] }
        severity: { oneOf: [{ $ref: "#/components/schemas/AlertSeverity" }, { type: "null" }] }
        comment: { type: string, maxLength: 500 }
        starts_at: { type: [string, "null"], format: date-time, description: "Default now." }
        ends_at: { type: string, format: date-time }
    ChannelKind: { type: string, enum: [telegram, slack, email, webhook] }
    ChannelConfig:
      type: object
      description: "Non-secret settings by kind. telegram: chat_id. email: addresses. webhook: url."
      properties:
        chat_id: { type: string }
        addresses: { type: array, maxItems: 20, items: { type: string, format: email } }
        url: { type: string }
    ChannelSecrets:
      type: object
      description: "Write-only by kind. telegram: bot_token. slack: webhook_url (https). webhook: signing_secret (optional; X-OpsHub-Signature is sha256= HMAC of the body)."
      properties:
        bot_token: { type: string }
        webhook_url: { type: string }
        signing_secret: { type: string, minLength: 16, maxLength: 256 }
    NotificationChannel:
      type: object
      required: [id, name, kind, config, secrets, locale, last_test_at, last_test_ok, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        config: { $ref: "#/components/schemas/ChannelConfig" }
        secrets: { type: array, items: { type: string }, description: "Names of the credentials that are set." }
        locale: { type: [string, "null"], enum: [en, km, null], description: "null = each member recipient's language, else the default." }
        last_test_at: { type: [string, "null"], format: date-time }
        last_test_ok: { type: [boolean, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NotificationChannelList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/NotificationChannel" } }
    NotificationChannelRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        kind: { $ref: "#/components/schemas/ChannelKind" }
        config: { $ref: "#/components/schemas/ChannelConfig" }
        secrets: { $ref: "#/components/schemas/ChannelSecrets" }
        locale: { type: [string, "null"], description: "en, km, or empty/null for the recipient's language." }
    ChannelTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string, description: "Why it failed, without credentials." }

    AuditActor:
      type: object
      required: [type, user_id, name, email]
      properties:
        type: { type: string, enum: [user, api_token, runner, system] }
        user_id: { type: [string, "null"], format: uuid }
        name: { type: [string, "null"], description: "Null for OpsHub, runners and deleted users." }
        email: { type: [string, "null"] }
    AuditProjectRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
    AuditEntry:
      type: object
      required: [id, created_at, action, area, summary, actor, resource_type, resource_id, project, ip, user_agent, before, after, metadata]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        action: { type: string, examples: [secret.rotate] }
        area: { type: string, examples: [secret] }
        summary: { type: string, description: "The entry as a sentence in the requested language." }
        actor: { $ref: "#/components/schemas/AuditActor" }
        resource_type: { type: string }
        resource_id: { type: [string, "null"] }
        project: { oneOf: [{ $ref: "#/components/schemas/AuditProjectRef" }, { type: "null" }] }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: [object, "null"], additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
    AuditEntryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor: { type: [string, "null"] }
    LogLevel:
      type: string
      enum: [debug, info, warn, error]
    LogSource:
      type: string
      enum: [service, job, deployment]
    LogEntry:
      type: object
      required: [id, ts, source, project_id, service, level, message, attributes]
      properties:
        id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/LogSource" }
        project_id: { type: [string, "null"], format: uuid, description: "Set on job and deployment lines." }
        service: { type: string, description: "The token's service, or <project>/<job> and <project>/deploy." }
        level: { $ref: "#/components/schemas/LogLevel" }
        message: { type: string }
        attributes: { type: object, additionalProperties: true }
    LogSearchResult:
      type: object
      required: [items, next_cursor, newest_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LogEntry" }
        next_cursor: { type: [string, "null"], description: "Pass as `before` for older lines." }
        newest_cursor: { type: [string, "null"], description: "Pass as `after` to follow new lines." }
    LogServiceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: string }
    IngestToken:
      type: object
      required: [id, name, service, token_prefix, created_by_name, last_used_at, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        service: { type: string }
        token_prefix: { type: string, examples: [ohl_ab12cd34] }
        token: { type: string, description: "Only in the create response." }
        created_by_name: { type: [string, "null"] }
        last_used_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    IngestTokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IngestToken" }
    IngestTokenRequest:
      type: object
      additionalProperties: false
      required: [name, service]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        service: { type: string, pattern: "^[a-z0-9][a-z0-9._/-]{0,99}$", description: "Lowercase letters, digits, dot, underscore, dash and slash." }
    IngestLineError:
      type: object
      required: [line, rule]
      properties:
        line: { type: integer, description: "1-based line number" }
        rule: { type: string, enum: [json_object, message_required, ts_format, too_old, attributes_max] }
    IngestResult:
      type: object
      required: [accepted, rejected, errors]
      properties:
        accepted: { type: integer }
        rejected: { type: integer }
        errors:
          type: array
          description: "The first 20 rejected lines."
          items: { $ref: "#/components/schemas/IngestLineError" }

    ErrorCode:
      type: string
      description: Stable machine-readable error code. New codes may be added over time.
      examples: [VALIDATION_FAILED, INVALID_CREDENTIALS, ACCOUNT_LOCKED]

    FieldError:
      type: object
      required: [field, rule]
      properties:
        field: { type: string, description: JSON path of the invalid field, examples: [email] }
        rule: { type: string, description: Failed validation rule, examples: [required, email, min] }
        param: { type: string, description: "Rule parameter, e.g. the minimum length" }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message: { type: string, description: English fallback. Clients should translate `code`. }
            details:
              type: object
              additionalProperties: true
              description: Code-specific data (VALIDATION_FAILED → `fields`; ACCOUNT_LOCKED / RATE_LIMITED → `retry_after_seconds`).
              properties:
                fields:
                  type: array
                  items: { $ref: "#/components/schemas/FieldError" }
                retry_after_seconds: { type: integer }
