openapi: 3.1.0
info:
  title: OpsHub API
  version: 0.12.0
  summary: All-in-One DevOps Platform
  description: |
    REST API for OpsHub. All resource endpoints are versioned under `/api/v1`.

    **Errors** never contain localized text. Every error response uses the `Error`
    envelope; clients translate `error.code` (see `web/src/locales/*/errors.json`).
    `message` is an English fallback only.

    **Authentication.** Browsers sign in with `POST /auth/login` and receive a 15-minute
    access token (send it as `Authorization: Bearer …`; keep it in memory only) plus a
    rotating refresh token in an httpOnly `SameSite=Strict` cookie. `POST /auth/refresh`
    and `POST /auth/logout` are cookie-authenticated and require the `X-CSRF-Token` header
    to equal the `opshub_csrf` cookie. Scripts use personal API tokens (`ohp_…`) as bearer
    tokens; `api:read` tokens are limited to safe methods.

    **Lists** are cursor-paginated: `?limit=1..200&cursor=…` → `{ items, next_cursor }`.

    **Optimistic locking.** Editable resources return an `ETag`; updates require
    `If-Match` and fail with `409 VERSION_CONFLICT` when the resource changed.

    **Idempotency.** Create endpoints marked with the `Idempotency-Key` header can be
    retried safely: the same key and request replay the first response for 24 hours.

    **Timestamps** are RFC 3339 in UTC. **IDs** are UUID v7.
  license:
    name: Proprietary
servers:
  - url: /
tags:
  - name: system
    description: Health, readiness and platform metadata.
  - name: auth
    description: Registration, sign-in, sessions, password reset and SSO.
  - name: account
    description: The signed-in user's profile, security settings and API tokens.
  - name: organizations
    description: |
      Organizations (tenants). Every organization-scoped endpoint answers 404 for
      non-members (never 403), so other tenants' IDs reveal nothing. Members lacking a
      permission get 403 FORBIDDEN. See docs/rbac.md for the permission matrix.
  - name: members
    description: Members, roles and invitations.
  - name: teams
    description: Teams group members for project access.
  - name: projects
    description: |
      Projects and access grants. A caller's project role is the highest of their inherited
      organization role (Owner/Admin/Viewer), direct grant and team grants (docs/rbac.md).
      Projects the caller can't see answer 404 PROJECT_NOT_FOUND.
  - name: repositories
    description: A project's connected GitHub/GitLab repository and its webhook.
  - name: environments
    description: Environments with non-secret variables and protection rules.
  - name: webhooks
    description: Git host webhook receivers, authenticated by signature instead of a session.
  - name: pipelines
    description: |
      Pipeline runs from `.opshub.yml` (docs/pipelines.md): runs, jobs, logs, approvals and
      live updates over Server-Sent Events. Jobs execute on runners (Module 5).
  - name: runners
    description: |
      Runner agents that execute pipeline jobs (docs/runners.md): registration tokens, the
      organization's runners, and job artifacts. Runners the caller can't see answer 404
      RUNNER_NOT_FOUND.
  - name: deployments
    description: |
      Deploy targets (SSH hosts, Docker hosts, Kubernetes clusters) and deployments of a
      container image to an environment: health checks, automatic revert, release history and
      one-click rollback (docs/deployments.md). Credentials are write-only.
  - name: infrastructure
    description: |
      The organization's asset inventory (servers, clusters, databases, domains), metrics from
      infra agents and TLS certificates probed on domains (docs/infrastructure.md). Assets the
      caller can't see answer 404 ASSET_NOT_FOUND.
  - name: monitoring
    description: |
      Uptime monitors (HTTP, TCP, SSL) checked by OpsHub, alert rules over monitors and the
      infrastructure of Module 7, alerts with escalation and acknowledgement, silences, and
      notification channels (Telegram, Slack, email, webhooks) with write-only credentials
      (docs/monitoring.md).
  - name: audit
    description: |
      The append-only audit log (docs/audit.md): every change and security event, shown as a
      sentence in the requested language (`locale`, else Accept-Language), with the raw
      before/after values. Owners and Admins read and export an organization's log; everyone
      sees their own account activity.
  - name: logs
    description: |
      Searchable logs (docs/logs.md): services send NDJSON lines with organization ingest
      tokens, and pipeline job and deployment output is copied in automatically. Job and
      deployment lines are shown only for projects the caller can see. Lines are kept for the
      operator's OPSHUB_LOG_RETENTION_DAYS.
  - name: secrets
    description: |
      Write-only project secrets (docs/secrets.md): no endpoint returns a value. Values are
      envelope-encrypted per version; rotation destroys older values. Pipeline jobs receive the
      secrets they list when a runner claims them (audited as secret.read). Developers change
      only secrets of unprotected environments; project-wide secrets count as protected.
  - name: runner-api
    description: |
      Used by the `opshub-runner` agent, not by people. `/runner/heartbeat` and
      `/runner/jobs/request` take the runner token (`ohr_…`); `/runner/jobs/{jobId}/…` take the
      job token (`ohj_…`) handed out with the job, valid only while that job runs.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      tags: [system]
      operationId: getReadiness
      summary: Readiness probe (checks database connectivity)
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/meta:
    get:
      tags: [system]
      operationId: getMeta
      summary: Public platform metadata used to bootstrap the UI
      security: []
      responses:
        "200":
          description: Platform metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        default: { $ref: "#/components/responses/Error" }

  # ─────────────────────────────── auth ───────────────────────────────

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an account
      description: |
        Always returns 202 for a valid request, whether or not the email is already
        registered (an existing owner receives an "account exists" email instead).
        Rate limited per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: Verification email sent.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: verification_sent }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address with the token from the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: Email verified. }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/verify-email/resend:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Re-send the verification email (always 202)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: Accepted. }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Returns `status: authenticated` with tokens (and sets the refresh/CSRF cookies),
        or `status: mfa_required` with a 5-minute challenge for `POST /auth/login/2fa`.
        Five failed attempts lock the account (423 ACCOUNT_LOCKED).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in, or a second factor is required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "423": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/login/2fa:
    post:
      tags: [auth]
      operationId: loginTwoFactor
      summary: Complete sign-in with a TOTP code or a recovery code
      description: For SSO sign-ins the challenge is carried by an httpOnly cookie and `mfa_token` may be omitted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginTwoFactorRequest" }
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh cookie and get a new access token
      description: Presenting an already-used refresh token revokes the whole session (401 REFRESH_TOKEN_REUSED).
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "200":
          description: New access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out this device (revokes the session and clears cookies)
      security:
        - refreshCookie: []
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Signed out. }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Email a single-use password reset link (always 202)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202": { description: Accepted. }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a reset token (signs out all sessions)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/v1/auth/sso/{provider}/start:
    get:
      tags: [auth]
      operationId: ssoStart
      summary: Begin SSO sign-in (browser navigation)
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOProvider"
        - name: next
          in: query
          description: Same-site path to return to after sign-in.
          schema: { type: string, examples: [/settings/profile] }
      responses:
        "302": { description: "Redirect to the identity provider (or to /login?error=CODE)." }

  /api/v1/auth/sso/{provider}/callback:
    get:
      tags: [auth]
      operationId: ssoCallback
      summary: SSO redirect target (browser navigation)
      security: []
      parameters:
        - $ref: "#/components/parameters/SSOProvider"
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "302":
          description: |
            To `/auth/sso-complete?next=…` (session cookies set), `/login/2fa?sso=1&next=…`
            (second factor required), or `/login?error=CODE`.

  # ─────────────────────────────── account ───────────────────────────────

  /api/v1/me:
    get:
      tags: [account]
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: Profile.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      tags: [account]
      operationId: updateMe
      summary: Update profile and display preferences
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: Updated profile.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }

  /api/v1/me/password:
    post:
      tags: [account]
      operationId: changePassword
      summary: Change password (signs out other sessions)
      description: Requires an interactive session (not an API token).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Changed. }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/me/2fa:
    get:
      tags: [account]
      operationId: getTwoFactorStatus
      summary: Two-factor authentication status
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }

  /api/v1/me/2fa/setup:
    post:
      tags: [account]
      operationId: setupTwoFactor
      summary: Start TOTP enrollment (returns the secret and otpauth URI once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "200":
          description: Pending secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPSetup" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/me/2fa/enable:
    post:
      tags: [account]
      operationId: enableTwoFactor
      summary: Confirm enrollment with a code; returns recovery codes once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/me/2fa/disable:
    post:
      tags: [account]
      operationId: disableTwoFactor
      summary: Turn off 2FA (password and a code or recovery code required)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisableTwoFactorRequest" }
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/me/2fa/recovery-codes:
    post:
      tags: [account]
      operationId: regenerateRecoveryCodes
      summary: Replace recovery codes (requires a current TOTP code)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: New codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/me/activity:
    get:
      tags: [account, audit]
      operationId: listAccountActivity
      summary: "Your own account activity: sign-ins, two-factor, password, tokens and sessions"
      description: "Needs a signed-in session (not an API token). Newest first."
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AuditLocale"
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryPage" }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/me/sessions:
    get:
      tags: [account]
      operationId: listSessions
      summary: Signed-in devices
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionPage" }

  /api/v1/me/sessions/{id}:
    delete:
      tags: [account]
      operationId: revokeSession
      summary: Sign out a device
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/me/tokens:
    get:
      tags: [account]
      operationId: listApiTokens
      summary: Personal API tokens
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Tokens, newest first (secrets are never returned).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APITokenPage" }
    post:
      tags: [account]
      operationId: createApiToken
      summary: Create a personal API token (secret shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAPITokenRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedAPIToken" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/me/tokens/{id}:
    delete:
      tags: [account]
      operationId: revokeApiToken
      summary: Revoke a token
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/me/identities:
    get:
      tags: [account]
      operationId: listIdentities
      summary: Linked SSO accounts
      responses:
        "200":
          description: Identities.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Identity" }

  /api/v1/me/identities/{id}:
    delete:
      tags: [account]
      operationId: unlinkIdentity
      summary: Unlink an SSO account (not the only sign-in method)
      parameters:
        - $ref: "#/components/parameters/PathID"
      responses:
        "204": { description: Unlinked. }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  # ─────────────────────────────── organizations ───────────────────────────────

  /api/v1/orgs:
    get:
      tags: [organizations]
      operationId: listOrganizations
      summary: Organizations I belong to (for the org switcher)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Organizations by name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationPage" }
    post:
      tags: [organizations]
      operationId: createOrganization
      summary: Create an organization (the caller becomes Owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [organizations]
      operationId: getOrganization
      summary: An organization I belong to (org.view)
      responses:
        "200":
          description: Organization.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [organizations]
      operationId: updateOrganization
      summary: Rename the organization (org.update — Admin+)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrganizationRequest" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    delete:
      tags: [organizations]
      operationId: deleteOrganization
      summary: Delete the organization (org.delete — Owner only)
      parameters:
        - name: confirm
          in: query
          required: true
          description: The organization's slug, retyped by the user.
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/transfer-ownership:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    post:
      tags: [organizations]
      operationId: transferOwnership
      summary: Make another member Owner and become Admin (org.transfer — Owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferOwnershipRequest" }
      responses:
        "204": { description: Transferred. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/permissions:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [organizations]
      operationId: getOrganizationPermissions
      summary: My role and allowed actions (drives UI route guards)
      responses:
        "200":
          description: Permissions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Permissions" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [members]
      operationId: listMembers
      summary: Members by name (member.view)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: q
          in: query
          description: Search by name or email.
          schema: { type: string }
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberPage" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrgID"
      - $ref: "#/components/parameters/UserID"
    patch:
      tags: [members]
      operationId: updateMemberRole
      summary: Change a member's role (member.update_role)
      description: |
        Owners change anyone. Admins change Developers and Viewers (and may step down), and
        can't assign Admin or Owner. The last Owner can't be demoted (409 LAST_OWNER).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMemberRoleRequest" }
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [members]
      operationId: removeMember
      summary: Remove a member, or leave (your own user ID)
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [members]
      operationId: listInvitations
      summary: Open invitations (member.invite)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Invitations, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPage" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [members]
      operationId: inviteMember
      summary: Invite someone by email (member.invite)
      description: Emails a 7-day single-use link. Inviting an address again replaces its open invitation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteRequest" }
      responses:
        "201":
          description: Invitation sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [members]
      operationId: revokeInvitation
      summary: Revoke an open invitation (member.invite)
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/invitations/preview:
    post:
      tags: [members]
      operationId: previewInvitation
      summary: Show an invitation to the signed-in holder of its token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/invitations/accept:
    post:
      tags: [members]
      operationId: acceptInvitation
      summary: Join the organization (your verified email must match the invitation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: The organization joined.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/teams:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [teams]
      operationId: listTeams
      summary: Teams by name (team.view)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Teams.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamPage" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team (team.manage — Admin+)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/teams/{teamId}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
    get:
      tags: [teams]
      operationId: getTeam
      summary: A team with its members (team.view)
      responses:
        "200":
          description: Team.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [teams]
      operationId: updateTeam
      summary: Rename or describe a team (team.manage)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamRequest" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team (team.manage)
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/teams/{teamId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [teams]
      operationId: addTeamMember
      summary: Add an organization member to the team (team.manage)
      responses:
        "204": { description: Added. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove someone from the team (team.manage)
      responses:
        "204": { description: Removed. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects I can see, by name
      description: |
        Organization Owners, Admins and Viewers see every project; Developers see the projects
        granted to them directly or through a team.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Search name or URL name.
          schema: { type: string }
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectPage" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project (project.create — Developer+)
      description: A Developer who creates a project gets a direct Admin grant on it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [projects]
      operationId: getProject
      summary: A project with my effective role and allowed actions (project.view)
      responses:
        "200":
          description: Project.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Update settings (project.update — project Admin+)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: Delete a project (project.delete)
      description: Removes the connected repository and OpsHub's webhook on the Git host.
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must equal the project's URL name.
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [projects]
      operationId: listProjectMembers
      summary: Who has access (project.view)
      description: |
        Direct user grants, team grants, and the organization's Owners and Admins (who inherit
        their role on every project). Organization Viewers can view every project and are not
        listed individually.
      responses:
        "200":
          description: Access list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProjectMember" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/members/{principal}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/Principal"
    put:
      tags: [projects]
      operationId: grantProjectAccess
      summary: Grant a user or team a role (project.manage_members)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrantRequest" }
      responses:
        "204": { description: Granted (replaces any previous grant). }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [projects]
      operationId: revokeProjectAccess
      summary: Remove a direct or team grant (project.manage_members)
      responses:
        "204": { description: Revoked. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/repository:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [repositories]
      operationId: getRepository
      summary: The connected repository (project.view)
      responses:
        "200":
          description: Repository.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repository" }
        "404":
          description: PROJECT_NOT_FOUND, or REPOSITORY_NOT_FOUND when none is connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      tags: [repositories]
      operationId: connectRepository
      summary: Connect or replace the repository (repo.connect)
      description: |
        Checks the repository and token with the Git host, then creates a webhook with a new
        random secret. If OpsHub can't create it (token without admin/Maintainer access, the
        host rejects the URL, or it is unreachable), the repository is connected in manual
        mode and the response carries the payload URL and secret — shown only once.
        Self-hosted hosts (`base_url`) that resolve to internal addresses are refused
        (`SSRF_BLOCKED`) unless the operator allows them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectRepositoryRequest" }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectRepositoryResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      tags: [repositories]
      operationId: disconnectRepository
      summary: Disconnect (repo.connect)
      description: Deletes the stored token and removes OpsHub's webhook from the Git host (best effort).
      responses:
        "204": { description: Disconnected. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/repository/test:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags: [repositories]
      operationId: testRepository
      summary: Re-check the stored token with the Git host (repo.connect)
      responses:
        "200":
          description: The token still works.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepositoryTest" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/repository/deliveries:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [repositories]
      operationId: listWebhookDeliveries
      summary: Recent webhook deliveries, newest first (repo.connect)
      description: Kept 30 days. Requests with a bad signature are listed with `signature_valid=false`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Deliveries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryPage" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/environments:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [environments]
      operationId: listEnvironments
      summary: Environments, development → production (project.view)
      responses:
        "200":
          description: Environments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [environments]
      operationId: createEnvironment
      summary: Create an environment (environment.manage)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentRequest" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/environments/{environmentId}:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
    get:
      tags: [environments]
      operationId: getEnvironment
      summary: An environment with its protection rule (project.view)
      responses:
        "200":
          description: Environment.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [environments]
      operationId: updateEnvironment
      summary: Replace kind, variables and protection (environment.manage)
      description: The name can't change (pipelines refer to it). Omit `protection` or send null to unprotect.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvironmentRequest" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    delete:
      tags: [environments]
      operationId: deleteEnvironment
      summary: Delete an environment (environment.manage)
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/webhooks/github/{repositoryId}:
    parameters:
      - $ref: "#/components/parameters/RepositoryID"
    post:
      tags: [webhooks]
      operationId: receiveGitHubWebhook
      summary: GitHub webhook receiver (HMAC X-Hub-Signature-256)
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAck" }
        "200":
          description: Already received (redelivery).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAck" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /api/v1/webhooks/gitlab/{repositoryId}:
    parameters:
      - $ref: "#/components/parameters/RepositoryID"
    post:
      tags: [webhooks]
      operationId: receiveGitLabWebhook
      summary: GitLab webhook receiver (X-Gitlab-Token, constant-time compare)
      security: []
      parameters:
        - { name: X-Gitlab-Token, in: header, required: true, schema: { type: string } }
        - { name: X-Gitlab-Event, in: header, required: true, schema: { type: string } }
        - { name: X-Gitlab-Event-UUID, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAck" }
        "200":
          description: Already received (redelivery).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookAck" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/pipeline/validate:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      tags: [pipelines]
      operationId: validatePipeline
      summary: Check a .opshub.yml without running it (project.view)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ValidatePipelineRequest" }
      responses:
        "200":
          description: Validation result, with line/column problems.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidatePipelineResult" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/runs:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [pipelines]
      operationId: listRuns
      summary: Pipeline runs, newest first (run.view)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RunStatus" } }
        - { name: trigger, in: query, schema: { $ref: "#/components/schemas/RunTrigger" } }
        - { name: ref, in: query, description: Branch name or full ref., schema: { type: string } }
      responses:
        "200":
          description: Runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPage" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [pipelines]
      operationId: triggerRun
      summary: Run the pipeline for a branch, tag or commit (pipeline.trigger)
      description: |
        Reads `.opshub.yml` at the resolved commit from the Git host. Errors: `REF_NOT_FOUND`,
        `PIPELINE_FILE_NOT_FOUND`, `PIPELINE_INVALID` (details.problems), `REPOSITORY_NOT_FOUND`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerRunRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [pipelines]
      operationId: getRun
      summary: A run with the current attempt of every job (run.view)
      responses:
        "200":
          description: Run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/runs/{runId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [pipelines]
      operationId: cancelRun
      summary: Cancel every unfinished job (run.cancel)
      responses:
        "200":
          description: Canceled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/runs/{runId}/rerun:
    parameters:
      - $ref: "#/components/parameters/RunID"
    post:
      tags: [pipelines]
      operationId: rerunRun
      summary: Re-run (pipeline.trigger)
      description: |
        `failed_only: true` retries the finished run's failed and canceled jobs in place (200);
        otherwise a new run is created from the same definition snapshot and commit (201).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RerunRequest" }
      responses:
        "200":
          description: Failed jobs retried.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "201":
          description: New run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/runs/{runId}/events:
    parameters:
      - $ref: "#/components/parameters/RunID"
    get:
      tags: [pipelines]
      operationId: runEvents
      summary: Server-Sent Events for run and job status changes (run.view)
      description: |
        Emits `event: update` (data `{"run_id"}`) on connect and whenever the run or one of its
        jobs changes; re-read the run. Comments (`: ping`) keep the connection alive. The stream
        ends after 5 minutes; reconnect with a fresh access token.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [pipelines]
      operationId: getJob
      summary: A job attempt with steps, attempts and approval gate (run.view)
      responses:
        "200":
          description: Job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{jobId}/retry:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [pipelines]
      operationId: retryJob
      summary: Retry a failed or canceled job with the jobs after it (pipeline.trigger)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: New attempt.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{jobId}/logs:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [pipelines]
      operationId: getJobLogs
      summary: Log chunks after a sequence number (run.view)
      description: "Send `Accept: text/plain` to download the whole log as a file."
      parameters:
        - { name: after_seq, in: query, schema: { type: integer, minimum: -1, default: -1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        "200":
          description: Log page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogPage" }
            text/plain:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{jobId}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [pipelines]
      operationId: streamJobLogs
      summary: Server-Sent Events of live log output (run.view)
      description: |
        `event: log` with `id` = sequence number and data `{"seq","content"}`; `event: end` once
        the job has finished and all output was sent. Resume with `Last-Event-ID` or `?after_seq`.
      parameters:
        - { name: after_seq, in: query, schema: { type: integer, minimum: -1 } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{jobId}/approvals:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      tags: [pipelines]
      operationId: decideJob
      summary: Approve or reject a job waiting for approval (approval.decide)
      description: |
        Environment protection rules apply: allowed roles ("this role or higher"), required
        approvals, and the person who started the run can't approve it. Refusals are
        `APPROVAL_NOT_ALLOWED` with `details.reason` = not_waiting | permission | role | self |
        already_decided.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApprovalRequest" }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobDetail" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/runners:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [runners]
      operationId: listRunners
      summary: The organization's runners with status and running jobs (runner.view)
      description: |
        `status` is `online` when the runner sent a heartbeat within 30 seconds, `offline`
        otherwise, or `disabled`.
      responses:
        "200":
          description: Runners.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerList" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/runner-registration-tokens:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    post:
      tags: [runners]
      operationId: createRunnerRegistrationToken
      summary: Issue a one-time token to register a runner (runner.manage)
      description: |
        The token is shown once, expires after an hour and registers a single runner. Labels
        given here are added to the runner's own.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationTokenRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationToken" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/runners/{runnerId}:
    parameters:
      - $ref: "#/components/parameters/RunnerID"
    patch:
      tags: [runners]
      operationId: updateRunner
      summary: Rename, relabel, limit or disable a runner (runner.manage)
      description: A disabled runner takes no new jobs; jobs it is running continue.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRunnerRequest" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runner" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    delete:
      tags: [runners]
      operationId: deleteRunner
      summary: Delete a runner and revoke its token (runner.manage)
      description: Jobs it is running fail with reason `runner_lost`.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/jobs/{jobId}/artifacts:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [runners]
      operationId: listJobArtifacts
      summary: A job's unexpired artifacts (run.view)
      responses:
        "200":
          description: Artifacts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactList" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/artifacts/{artifactId}/download:
    parameters:
      - $ref: "#/components/parameters/ArtifactID"
    get:
      tags: [runners]
      operationId: downloadArtifact
      summary: Download an artifact archive (run.view)
      responses:
        "200":
          description: gzip-compressed tar archive.
          headers:
            X-Content-SHA256: { schema: { type: string }, description: Hex SHA-256 of the archive. }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/deploy-targets:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [deployments]
      operationId: listDeployTargets
      summary: The organization's deploy targets (target.view)
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployTargetList" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [deployments]
      operationId: createDeployTarget
      summary: Add a deploy target (target.manage)
      description: |
        `config` and `credentials` depend on `kind` (see the SSH/Docker/Kubernetes schemas).
        Credentials are encrypted and never returned; `credentials` in answers lists which
        fields are set.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeployTargetRequest" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployTarget" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/deploy-targets/{targetId}:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    get:
      tags: [deployments]
      operationId: getDeployTarget
      summary: One deploy target (target.view)
      responses:
        "200":
          description: Target.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployTarget" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [deployments]
      operationId: updateDeployTarget
      summary: Replace description and config; credentials when given (target.manage)
      description: The name and kind can't change (pipelines refer to targets by name). Omit `credentials` to keep them.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateDeployTargetRequest" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeployTarget" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    delete:
      tags: [deployments]
      operationId: deleteDeployTarget
      summary: Delete a deploy target (target.manage)
      description: Refused while a deployment to it is in progress (`DEPLOY_TARGET_IN_USE`); history keeps its name.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/deploy-targets/{targetId}/test:
    parameters:
      - $ref: "#/components/parameters/TargetID"
    post:
      tags: [deployments]
      operationId: testDeployTarget
      summary: Check connectivity (target.manage)
      description: |
        For SSH hosts that aren't trusted yet, each check carries the host key `fingerprint` and
        no credentials are sent; pin it with PATCH (`config.host_keys` or `config.host_key`).
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetTestResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/deployments:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [deployments]
      operationId: listDeployments
      summary: Release history, newest first (deployment.view)
      parameters:
        - { name: environment_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/DeploymentStatus" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: current, in: query, description: Only each environment's current release., schema: { type: boolean } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Deployments.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeploymentPage" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/environments/{environmentId}/deployments:
    parameters:
      - $ref: "#/components/parameters/EnvironmentID"
    post:
      tags: [deployments]
      operationId: createDeployment
      summary: Deploy an image to the environment (deployment.create)
      description: |
        Protected environments need an allowed role; those that require approvals only take
        pipeline deploys (`ENVIRONMENT_PROTECTED`, `details.reason` = role | approvals). One
        deployment at a time per environment (`DEPLOYMENT_IN_PROGRESS`). Blue/green is for
        Kubernetes targets with a service (`STRATEGY_NOT_SUPPORTED`).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDeploymentRequest" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/deployments/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/DeploymentID"
    get:
      tags: [deployments]
      operationId: getDeployment
      summary: A deployment with its health checks (deployment.view)
      responses:
        "200":
          description: Deployment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/deployments/{deploymentId}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/DeploymentID"
    get:
      tags: [deployments]
      operationId: streamDeploymentLogs
      summary: Server-Sent Events of status and log output (deployment.view)
      description: |
        `event: status` (data `{"deployment_id","status"}`) on connect and on every change;
        `event: log` with `id` = sequence number and data `{"seq","content"}`; `event: end` once
        the deployment finished and all output was sent. Resume with `Last-Event-ID`.
      parameters:
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/deployments/{deploymentId}/rollback:
    parameters:
      - $ref: "#/components/parameters/DeploymentID"
    post:
      tags: [deployments]
      operationId: rollbackDeployment
      summary: Redeploy the release before the environment's current one (deployment.rollback)
      description: |
        Only the environment's current deployment can be rolled back
        (`NOTHING_TO_ROLL_BACK`, `details.reason` = not_current | no_previous). Protected
        environments need an allowed role but no approvals.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: The rollback deployment, queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/assets:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [infrastructure]
      operationId: listAssets
      summary: The organization's assets (infra.view)
      parameters:
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/AssetKind" } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, description: Name or address contains., schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AssetStatus" } }
      responses:
        "200":
          description: Assets (at most 1000).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetList" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [infrastructure]
      operationId: createAsset
      summary: Add an asset (infra.manage)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetRequest" }
      responses:
        "201":
          description: Created.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/certificates:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [infrastructure]
      operationId: listCertificates
      summary: Domain certificates, soonest expiry first (infra.view)
      parameters:
        - name: expiring_within
          in: query
          description: Only certificates expiring within this time (e.g. 30d, 72h) or failing their check.
          schema: { type: string, examples: ["30d"] }
      responses:
        "200":
          description: Certificates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateList" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/assets/{assetId}:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    get:
      tags: [infrastructure]
      operationId: getAsset
      summary: One asset (infra.view)
      responses:
        "200":
          description: Asset.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [infrastructure]
      operationId: updateAsset
      summary: Replace an asset's name, address, description, tags, metadata and TLS port (infra.manage)
      description: The kind can't change. A domain whose address or port changes is checked again.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetRequest" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Asset" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    delete:
      tags: [infrastructure]
      operationId: deleteAsset
      summary: Delete an asset with its metrics and certificate (infra.manage)
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/assets/{assetId}/metrics:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    get:
      tags: [infrastructure]
      operationId: getAssetMetrics
      summary: CPU, memory and disk series (infra.view)
      description: |
        Averages and maxima per step. Defaults: the last hour and a step giving at most ~300
        points. Ranges older than 30 days come from hourly rollups (step ≥ 1 h). At most 1000
        points and 400 days.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: step, in: query, description: "Seconds or a duration: 60, 5m, 1h, 1d.", schema: { type: string } }
      responses:
        "200":
          description: Series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetricSeries" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/assets/{assetId}/agent-token:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    post:
      tags: [infrastructure]
      operationId: issueAgentToken
      summary: Issue or rotate a server's infra agent token (infra.manage)
      description: Shown once. Rotating revokes the previous token. Servers only (`AGENT_NOT_SUPPORTED`).
      responses:
        "201":
          description: Token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentToken" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/assets/{assetId}/certificate:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    get:
      tags: [infrastructure]
      operationId: getAssetCertificate
      summary: A domain's last certificate check (infra.view)
      responses:
        "200":
          description: The certificate, or null when never checked.
          content:
            application/json:
              schema:
                type: object
                required: [certificate]
                properties:
                  certificate:
                    oneOf:
                      - $ref: "#/components/schemas/Certificate"
                      - type: "null"
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/assets/{assetId}/certificate/check:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    post:
      tags: [infrastructure]
      operationId: checkAssetCertificate
      summary: Probe a domain's certificate now (infra.manage)
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/projects/{projectId}/secrets:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: A project's secrets, metadata only (secret.list)
      description: Project-wide secrets first, then by environment and name.
      parameters:
        - name: environment_id
          in: query
          description: An environment's id for its secrets only, or `none` for project-wide secrets only.
          schema: { type: string }
      responses:
        "200":
          description: Secrets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretList" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    post:
      tags: [secrets]
      operationId: createSecret
      summary: Create a secret with its first version (secret.create)
      description: |
        Names are unique per scope (project-wide, or one environment). Developers can create
        secrets only for unprotected environments. At most 500 per project (SECRET_LIMIT_REACHED).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretCreateRequest" }
      responses:
        "201":
          description: Created. The value is never returned.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/secrets/{secretId}:
    parameters:
      - $ref: "#/components/parameters/SecretID"
    get:
      tags: [secrets]
      operationId: getSecret
      summary: One secret's metadata (secret.list)
      responses:
        "200":
          description: Secret.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [secrets]
      operationId: updateSecret
      summary: Change a secret's description (secret.update)
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretUpdateRequest" }
      responses:
        "200":
          description: Updated.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "428": { $ref: "#/components/responses/Error" }
    delete:
      tags: [secrets]
      operationId: deleteSecret
