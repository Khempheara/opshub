  /api/v1/orgs/{orgId}/audit-log:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [audit]
      operationId: listAuditLog
      summary: "The organization's audit log, newest first (audit.view)"
      parameters:
        - $ref: "#/components/parameters/AuditArea"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditProject"
        - $ref: "#/components/parameters/AuditResourceType"
        - $ref: "#/components/parameters/AuditResourceID"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/AuditLocale"
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryPage" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/audit-log/export:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [audit]
      operationId: exportAuditLog
      summary: "Every matching entry as CSV (audit.export); the export itself is audited"
      description: |
        UTF-8 with a byte-order mark, so spreadsheet programs show Khmer correctly. Columns:
        time, actor_type, actor_name, actor_email, action, summary, resource_type,
        resource_id, project_id, project_name, ip, user_agent, before, after, metadata (JSON).
        Cells that start with = + - @ get a leading apostrophe.
      parameters:
        - $ref: "#/components/parameters/AuditArea"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditProject"
        - $ref: "#/components/parameters/AuditResourceType"
        - $ref: "#/components/parameters/AuditResourceID"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditLocale"
      responses:
        "200":
          description: "The CSV file (attachment audit-log-<org>-<date>.csv)."
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

  /api/v1/orgs/{orgId}/logs:
    parameters:
      - $ref: "#/components/parameters/OrgID"
    get:
      tags: [logs]
      operationId: searchLogs
      summary: "Search log lines, newest first (logs.view)"
      description: |
        The range defaults to the last hour and spans at most 31 days. `q` is a full-text query
        (words, "quoted phrases", -excluded); text in Khmer script matches as a substring.
        Page to older lines with `before=next_cursor`; follow new lines with
        `after=newest_cursor`.
      parameters:
        - { name: from, in: query, description: "Start (RFC 3339), inclusive", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "End (RFC 3339), exclusive", schema: { type: string, format: date-time } }
        - { name: q, in: query, description: "Search text", schema: { type: string, maxLength: 200 } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/LogSource" } }
        - { name: service, in: query, schema: { type: string } }
        - { name: level, in: query, description: "Minimum level", schema: { $ref: "#/components/schemas/LogLevel" } }
        - { name: before, in: query, description: "Cursor: lines older than this one", schema: { type: string } }
        - { name: after, in: query, description: "Cursor: lines newer than this one", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "200":
          description: "OK."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogSearchResult" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }

