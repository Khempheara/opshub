name: Release

# Push a tag like v1.2.0 to publish:
#   - images ghcr.io/<owner>/opshub-{api,web,runner,backup}:<tag> (+ latest), amd64 and arm64,
#     each scanned with Trivy first;
#   - a GitHub Release with opshub-install-<tag>.tar.gz: compose file, Caddyfile and the
#     ./opshub installer, preset to pull this version (docs/install-docker.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [api, web, runner, backup]
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names are lowercase)
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opshub-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build for the scan (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          tags: opshub-${{ matrix.image }}:scan
          load: true
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
      - name: Trivy vulnerability scan (fail on HIGH/CRITICAL)
        # Pinned to a commit (v0.36.0): action tags are mutable.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: opshub-${{ matrix.image }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:${{ github.ref_name }}
            ${{ steps.name.outputs.ref }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: false
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

  bundle:
    name: Install bundle and GitHub Release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build opshub-install-${{ github.ref_name }}.tar.gz
        run: |
          set -euo pipefail
          out="opshub-install-${GITHUB_REF_NAME}"
          mkdir "$out"
          # -L: the monitoring links become real files; the source build file isn't needed.
          cp -RL deploy/install/. "$out/"
          rm -f "$out/compose.build.yaml"
          printf '%s\n' "$GITHUB_REF_NAME" > "$out/VERSION"
          sed -i "s|ghcr.io/khempheara/opshub|ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opshub|g" "$out/opshub" "$out/compose.yaml"
          cp docs/install-docker.md "$out/README.md"
          tar -czf "$out.tar.gz" "$out"
          sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "OpsHub $GITHUB_REF_NAME" \
            "opshub-install-$GITHUB_REF_NAME.tar.gz" "opshub-install-$GITHUB_REF_NAME.tar.gz.sha256"
