<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{.Subject}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #e4e4e7;">
<tr><td style="padding:28px 32px;font-family:'Noto Sans Khmer','Kantumruy Pro','Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;font-size:15px;line-height:{{if eq .Lang "km"}}1.8{{else}}1.6{{end}};">
<p style="margin:0 0 20px;font-weight:700;font-size:18px;">OpsHub</p>
<h1 style="margin:0 0 16px;font-size:20px;line-height:1.5;">{{.Heading}}</h1>
{{if .Greeting}}<p style="margin:0 0 12px;">{{.Greeting}}</p>{{end}}
<p style="margin:0 0 20px;">{{.Body}}</p>
{{if .URL}}
<p style="margin:0 0 24px;"><a href="{{.URL}}" style="display:inline-block;background:#18181b;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:600;">{{.Button}}</a></p>
<p style="margin:0 0 6px;font-size:13px;color:#52525b;">{{.LinkFallback}}</p>
<p style="margin:0 0 20px;font-size:13px;word-break:break-all;"><a href="{{.URL}}" style="color:#2563eb;">{{.URL}}</a></p>
{{end}}
<p style="margin:24px 0 0;font-size:12px;color:#71717a;border-top:1px solid #e4e4e7;padding-top:16px;">{{.Footer}}</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
