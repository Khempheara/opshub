# Serves the SPA and proxies API traffic so browser and API share one origin
# (session cookies work without CORS).
#
# Note: nginx does not inherit add_header into a location that declares its own,
# so security headers are repeated per static location. The API sets its own headers.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  location ~ ^/(api|docs|healthz|readyz)(/|$) {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (never append) so clients cannot spoof their IP in audit logs.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Server-Sent Events (live pipeline logs) must not be buffered.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Hashed assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
