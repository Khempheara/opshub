{{- if .Values.networkPolicy.enabled -}}
{{- $root := . -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opshub.fullname" . }}-api
  labels:
    {{- include "opshub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opshub.selector" (dict "root" . "component" "api") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "opshub.selector" (dict "root" . "component" "web") | nindent 14 }}
        {{- with .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- with .Values.networkPolicy.metricsNamespaceSelector }}
        - namespaceSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - { port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opshub.fullname" . }}-web
  labels:
    {{- include "opshub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opshub.selector" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- with .Values.networkPolicy.ingressNamespaceSelector }}
        - namespaceSelector:
            matchLabels: {{- toYaml . | nindent 14 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - { port: 8080 }
{{- end }}
