{{- if .Values.migrations.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opshub.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "opshub.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # Before the new API version starts; the job is removed once it succeeded.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "opshub.selector" (dict "root" . "component" "migrations") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "opshub.podSecurity" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "opshub.image" (dict "root" . "image" .Values.api.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up"]
          env:
            {{- include "opshub.env" . | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          securityContext:
            {{- include "opshub.containerSecurity" . | nindent 12 }}
{{- end }}
