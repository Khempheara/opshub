# nginx for the all-in-one image (deploy/aio/start.sh). The site itself is the shared
# deploy/docker/nginx.conf.template, rendered into /tmp/opshub/nginx/opshub.conf at start.
worker_processes auto;
pid /tmp/opshub/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;
  server_tokens off;
  # Runners upload artifacts (100 MB) and caches (500 MB) through this server.
  client_max_body_size 600m;
  client_body_temp_path /tmp/opshub/nginx/body;
  proxy_temp_path /tmp/opshub/nginx/proxy;
  fastcgi_temp_path /tmp/opshub/nginx/fastcgi;
  uwsgi_temp_path /tmp/opshub/nginx/uwsgi;
  scgi_temp_path /tmp/opshub/nginx/scgi;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  include /tmp/opshub/nginx/opshub.conf;
}
